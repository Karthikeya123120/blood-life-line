{% extends "base.html" %}
{% block title %}Login{% endblock %}
{% block content %}
<div class="container py-5"><div class="form-card">
<h2 class="fw-bold mb-4">Welcome Back</h2>
<form method="post">
<label>Email</label><input class="form-control mb-3" type="email" name="email" required>
<label>Password</label><input class="form-control mb-4" type="password" name="password" required>
<button class="btn btn-danger w-100">Login</button>
</form>
<p class="mt-3 text-center">New user? <a href="{{ url_for('register') }}">Create an account</a></p>
</div></div>
{% endblock %}
